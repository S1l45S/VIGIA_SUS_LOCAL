services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build: .
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
      python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-development-only-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: ${MONGODB_DATABASE:-vigiasus_local}
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"

  tests:
    build: .
    profiles: ["test"]
    command: ["pytest", "--ds=config.settings", "-q"]
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-test-only-key}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: vigiasus_test
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb_data:
