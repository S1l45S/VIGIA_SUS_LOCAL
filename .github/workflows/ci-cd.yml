name: CI/CD

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Testes e validações
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-insecure-key
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DATABASE: vigiasus_ci
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validar estilo com Ruff
        run: ruff check . --ignore F401,I001,RUF012,EXE001,N999

      - name: Verificar configuração Django
        run: python manage.py check

      - name: Executar testes
        run: pytest --ds=config.settings

  release:
    name: Publicar release no GitHub
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Empacotar código-fonte
        run: git archive --format=tar.gz --prefix=vigiasus-local/ -o "vigiasus-local-${GITHUB_REF_NAME}.tar.gz" HEAD

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          files: vigiasus-local-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
