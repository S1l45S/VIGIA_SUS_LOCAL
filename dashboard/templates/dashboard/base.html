{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}VigiaSUS Local{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'dashboard/css/dashboard.css' %}">
</head>

<body>
    <header class="topo">
        <strong>VigiaSUS Local</strong>
        {% if user.is_authenticated %}
        <span class="topo-usuario">{{ user.get_username }}</span>
        {% endif %}
    </header>
    <main class="conteudo">
        {% block conteudo %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>

</html>
